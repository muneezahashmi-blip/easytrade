name: Dynatrace SLO Gate Practice

on:
  workflow_dispatch:
    inputs:
      inject_failure:
        description: "Simulate a bad deployment (for testing the Guardian gate)?"
        required: false
        type: boolean
        default: false

jobs:
  practice-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Simulate deployment
        run: |
          echo "Pretending to deploy easytrade... (this is a stand-in step, not a real deploy)"
          if [ "${{ inputs.inject_failure }}" = "true" ]; then
            echo "inject_failure=true -> simulating a degraded release"
          fi
          echo "Deployment finished at $(date -u +%FT%TZ)"

      - name: Trigger Dynatrace Guardian validation
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_TOKEN: ${{ secrets.DT_TOKEN }}
        run: |
          FROM=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "DT_URL is: $DT_URL"
          echo "Full endpoint: $DT_URL/platform/ingest/v1/events.sdlc"
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST "$DT_URL/platform/ingest/v1/events.sdlc" \
            -H "Authorization: Api-Token $DT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Accept: */*" \
            -d "{\"event.type\": \"validation.triggered\", \"event.kind\": \"SDLC_EVENT\", \"unique_id\": \"easytrade-practice-${{ github.run_id }}\", \"timeframe.from\": \"$FROM\", \"timeframe.to\": \"$TO\", \"deployment.name\": \"easytrade-practice-deploy\", \"environment.stage\": \"practice\", \"version\": \"${{ github.sha }}\"}"
